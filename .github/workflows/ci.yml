name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Build, Test & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Run test suite
        run: npm test

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Verify build artifacts and bundle size
        run: |
          test -f dist/index.html
          test -f dist/sitemap-index.xml
          du -sh dist/

  docker:
    name: Docker Build, Smoke Test & Publish
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rapido-astro:ci
          cache-from: type=gha

      - name: Run container smoke test
        run: |
          docker run -d --rm --name rapido-astro-ci \
            --read-only \
            --tmpfs /tmp \
            --security-opt no-new-privileges:true \
            -p 3000:3000 \
            rapido-astro:ci

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz >/dev/null; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              docker logs rapido-astro-ci || true
              exit 1
            fi
            sleep 1
          done

          for route in "/" "/paqueteria" "/outlet" "/contacto"; do
            status=$(curl -sS -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000${route}")
            echo "GET ${route} -> ${status}"
            test "$status" -eq 200
          done

          ready_res=$(curl -sS -w "\n%{http_code}" "http://127.0.0.1:3000/readyz")
          ready_body=$(printf '%s\n' "$ready_res" | sed '$d')
          ready_status=$(printf '%s\n' "$ready_res" | tail -n1)
          echo "GET /readyz -> ${ready_status}: ${ready_body}"
          test "$ready_status" -eq 503
          echo "$ready_body" | grep -q "not_ready"

          api_res=$(curl -sS -w "\n%{http_code}" -X POST http://127.0.0.1:3000/api/contact \
            -H "Content-Type: application/json" \
            -d 'invalid-json{')
          api_body=$(printf '%s\n' "$api_res" | sed '$d')
          api_status=$(printf '%s\n' "$api_res" | tail -n1)
          echo "POST /api/contact (invalid JSON) -> ${api_status}: ${api_body}"
          test "$api_status" -eq 400
          echo "$api_body" | grep -q "INVALID_JSON"

          prod_res=$(curl -sS -w "\n%{http_code}" -X POST http://127.0.0.1:3000/api/contact \
            -H "Content-Type: application/json" \
            -d '{"name":"Test User","phone":"640397434","email":"test@ejemplo.es","subject":"paqueteria","message":"Consulta de prueba en smoke test.","privacy":true,"turnstileToken":"dummy-token"}')
          prod_body=$(printf '%s\n' "$prod_res" | sed '$d')
          prod_status=$(printf '%s\n' "$prod_res" | tail -n1)
          echo "POST /api/contact (unconfigured prod) -> ${prod_status}: ${prod_body}"
          test "$prod_status" -eq 503
          echo "$prod_body" | grep -q "SERVICE_UNAVAILABLE"

      - name: Stop smoke test container
        if: always()
        run: docker rm -f rapido-astro-ci || true

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push multi-arch Docker image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
