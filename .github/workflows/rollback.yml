name: Rollback Container Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Published image tag to promote back to :latest (e.g. sha-abc1234 or 1.0.0)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  rollback:
    name: Re-tag GHCR Image to latest
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify target tag and promote to latest
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$IMAGE_TAG" = "latest" ] || ! printf '%s' "$IMAGE_TAG" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$'; then
            echo "Invalid rollback image_tag: ${IMAGE_TAG}" >&2
            exit 1
          fi

          IMAGE_NAME="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          SOURCE_IMAGE="${IMAGE_NAME}:${IMAGE_TAG}"
          TARGET_IMAGE="${IMAGE_NAME}:latest"

          echo "Inspecting ${SOURCE_IMAGE}..."
          docker buildx imagetools inspect "${SOURCE_IMAGE}"

          echo "Promoting ${SOURCE_IMAGE} -> ${TARGET_IMAGE}..."
          docker buildx imagetools create -t "${TARGET_IMAGE}" "${SOURCE_IMAGE}"
